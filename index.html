<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-column phone app shell — subject-colour header band, white sheets, accent for progress; bottom tab bar */
:root{
  --bg:#EEF1F0; --sheet:#FBFCFB; --ink:#1B2230; --sub:#5A6474; --line:#D6DCDA;
  --ai:#7A3B2E; --ai-soft:#F1DFDA; --kin:#A87C1F; --kin-soft:#F3E8C9;
  --ok:#2F7A55; --ok-soft:#DCEFE4; --ng:#A8343B; --ng-soft:#F6DEDF;
  --onai:#F7F5EE;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --goth:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --sheet:#162031; --ink:#E5E8EE; --sub:#9AA5B6; --line:#2A3850;
  --ai:#E3A898; --ai-soft:#3C2420; --kin:#E2BC5E; --kin-soft:#3A3120;
  --ok:#6CC69A; --ok-soft:#173527; --ng:#EE8A8F; --ng-soft:#3E1F24; --onai:#0E1420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --sheet:#162031; --ink:#E5E8EE; --sub:#9AA5B6; --line:#2A3850;
  --ai:#E3A898; --ai-soft:#3C2420; --kin:#E2BC5E; --kin-soft:#3A3120;
  --ok:#6CC69A; --ok-soft:#173527; --ng:#EE8A8F; --ng-soft:#3E1F24; --onai:#0E1420; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--goth);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ai)}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ai);color:var(--onai)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--mincho);font-weight:800;font-size:1.3rem;letter-spacing:.08em}
.brand small{font-family:var(--goth);font-weight:500;font-size:.7rem;letter-spacing:.05em;opacity:.8;margin-left:6px}
header.top .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:0;padding-bottom:10px}
.grades button{border:1px solid rgba(128,128,128,.55);background:transparent;color:var(--onai);border-radius:999px;padding:3px 0;font-weight:700;font-size:.85rem;cursor:pointer}
.grades button[aria-pressed="true"]{background:var(--onai);color:var(--ai);border-color:var(--onai)}
.streak{font-size:.8rem;font-weight:700;background:rgba(128,128,128,.22);padding:3px 10px;border-radius:999px;white-space:nowrap}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-top:18px;padding-bottom:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
h2{font-family:var(--mincho);font-weight:700;font-size:1.15rem;margin:0;letter-spacing:.04em}
.eyebrow{font-size:.72rem;letter-spacing:.14em;color:var(--sub);font-weight:700}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px}
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:84px;height:84px}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--line)} .ring .fg{stroke:var(--kin);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{fill:var(--ink);font-family:var(--mincho);font-weight:800;font-size:22px}
.stats{display:grid;gap:4px;min-width:0}
.stats b{font-variant-numeric:tabular-nums}
.big-btn{display:block;width:100%;border:0;border-radius:12px;background:var(--ai);color:var(--onai);padding:15px 16px;font-weight:700;font-size:1.05rem;cursor:pointer;text-align:left}
.big-btn span{display:block;font-weight:500;font-size:.8rem;opacity:.85}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-btn{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:11px;font-weight:700;cursor:pointer}
.group-title{display:flex;align-items:baseline}
.group-title .kan{font-family:var(--mincho);font-size:1.5rem;font-weight:800;color:var(--ai);line-height:1;margin-right:10px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px;min-width:0}
.cat .nm{font-weight:700;font-size:.95rem}
.cat .meta{font-size:.72rem;color:var(--sub);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--kin);border-radius:999px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--sub);cursor:pointer}
nav.tabs button .g{font-family:var(--mincho);font-size:1.25rem;font-weight:800;line-height:1.3}
nav.tabs button[aria-current="page"]{color:var(--ai)}
nav.tabs button[aria-current="page"] .g{color:var(--kin)}
details.lesson{background:var(--sheet);border:1px solid var(--line);border-radius:12px}
details.lesson summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:700;display:flex;justify-content:space-between}
details.lesson summary::-webkit-details-marker{display:none}
details.lesson summary::after{content:"＋";color:var(--kin)}
details.lesson[open] summary::after{content:"－"}
.gchip{font-size:.7rem;font-weight:700;color:var(--kin);margin-left:auto;margin-right:8px;white-space:nowrap}
.lesson .body{padding:0 16px 16px;font-size:.93rem}
.lesson .body p{margin:.4em 0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.tbl th{color:var(--sub);font-weight:700;font-size:.78rem;white-space:nowrap}
.key{background:var(--kin-soft);padding:0 4px;border-radius:4px}
.formula{font-family:"Times New Roman",var(--mincho);font-size:1.05rem}
#quiz{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.qhead{display:flex;align-items:center;padding-top:12px;padding-bottom:12px}
.qhead .x{border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--sub);padding:0 10px 0 4px}
.qhead .bar{flex:1;height:8px}
.qhead .cnt{font-size:.8rem;color:var(--sub);font-variant-numeric:tabular-nums;margin-left:10px}
.qcat{font-size:.75rem;font-weight:700;color:var(--kin);letter-spacing:.1em}
.qtext{font-size:1.12rem;font-weight:500;margin:.3em 0 .8em}
.qtext .big{font-family:"Times New Roman",var(--mincho);font-weight:700;font-size:1.7rem;display:block;margin:.3em 0;color:var(--ai);line-height:1.4}
.qtext .quote{display:block;background:var(--sheet);border-left:3px solid var(--kin);padding:8px 12px;margin:.5em 0;border-radius:0 8px 8px 0}
.choices{display:grid;gap:10px}
.ch{border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:13px 14px;text-align:left;cursor:pointer;font-size:1.05rem;display:flex;align-items:flex-start}
.ch .lb{font-family:var(--mincho);font-weight:800;color:var(--sub);min-width:1.6em}
.ch.ok{border-color:var(--ok);background:var(--ok-soft)}
.ch.ng{border-color:var(--ng);background:var(--ng-soft)}
.ch[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:14px;font-size:.95rem}
.fb.ok{background:var(--ok-soft)} .fb.ng{background:var(--ng-soft)}
.fb .v{font-weight:800;font-size:1.05rem;margin-bottom:4px}
.fb.ok .v{color:var(--ok)} .fb.ng .v{color:var(--ng)}
.next{margin-top:14px}
.result{text-align:center;display:grid;gap:14px;padding-top:24px;padding-bottom:24px}
.result .score{font-family:var(--mincho);font-size:3.4rem;font-weight:800;color:var(--ai);line-height:1}
.result ul{text-align:left;margin:0;padding-left:1.2em;font-size:.9rem}
.decks{display:flex;overflow-x:auto;padding-bottom:4px}
.deck{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem;white-space:nowrap;cursor:pointer;margin-right:8px}
.deck[aria-pressed="true"]{background:var(--ai);color:var(--onai);border-color:var(--ai)}
.flash{min-height:260px;border-radius:16px;background:var(--sheet);border:1px solid var(--line);display:grid;justify-items:center;align-content:center;text-align:center;padding:24px 18px;cursor:pointer;gap:10px}
.flash .front{font-family:var(--mincho);font-weight:800;font-size:1.9rem;color:var(--ai);line-height:1.4}
.flash .front.long{font-size:1.2rem;font-weight:700}
.flash .back .mean{font-weight:700;font-size:1.15rem}
.flash .back .ex{color:var(--sub);font-size:.92rem;margin-top:6px}
.flash .hint{font-size:.75rem;color:var(--sub)}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardbtns .sub-btn.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cardbtns .sub-btn.again{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.toggle{display:flex;align-items:center;font-size:.85rem;color:var(--sub)}
.toggle input{margin-right:6px}
.weak ul{list-style:none;margin:0;padding:0}
.weak li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.weak .w{color:var(--ng);font-weight:700;font-size:.8rem;white-space:nowrap;margin-left:10px}
.empty{color:var(--sub);text-align:center;padding:20px 0;font-size:.9rem}
.note{font-size:.78rem;color:var(--sub)}
.confirm{display:flex;flex-wrap:wrap;align-items:center}
.confirm>*{margin-right:8px}
svg.fig{display:block;margin:6px auto;max-width:100%}
@media (min-width:740px){
  .wrap,nav.tabs .in{max-width:820px}
  body{font-size:17px}
  .cats{grid-template-columns:repeat(4,1fr)}
  #quiz .wrap{max-width:680px}
  .flash{min-height:340px}.flash .front{font-size:2.4rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ===== 共通ヘルパー ===== */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;const t=a[i];a[i]=a[j];a[j]=t}return a};
const pick=(pool,correct,n)=>shuffle(Array.from(new Set(pool)).filter(x=>x!==correct)).slice(0,n||3);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let v=0;while(v===0)v=ri(a,b);return v};
const choose=a=>a[Math.floor(Math.random()*a.length)];
const Q=[],DECKS={},LESSONS=[];
/* 静的問題：[問題, 正解, 誤答, 誤答, 誤答, 解説] */
function mc(cat,id,label,prompt,correct,wrong,explain,gr){Q.push({type:"mc",cat:cat,id:id,label:label,prompt:prompt,correct:String(correct),wrong:wrong.map(String),explain:explain||"",gr:+gr})}
function addList(cat,gr,list){list.forEach((r,i)=>{const lab=String(r[0]).replace(/<[^>]+>/g,"");mc(cat,cat+"-"+gr+"-"+i,lab.length>26?lab.slice(0,26)+"…":lab,r[0],r[1],[r[2],r[3],r[4]],r[5],gr)})}
/* 自動生成問題：fn() → [問題HTML, 正解, 誤答候補[], 解説] 。n個の枠で記録 */
function gen(cat,id,label,gr,fn,n){for(let k=0;k<(n||4);k++)Q.push({type:"gen",cat:cat,id:id+"-"+k,label:label,gr:+gr,fn:fn})}
function fillWrong(correct,cands,filler){const out=[];const seen={};seen[correct]=1;
  cands.forEach(c=>{c=String(c);if(c&&!seen[c]&&out.length<3){seen[c]=1;out.push(c)}});
  let g=0;while(out.length<3&&g<60){const c=String(filler(g++));if(!seen[c]){seen[c]=1;out.push(c)}}
  return out}
</script>

<script>
/* ===== 学年・保存 ===== */
const GNAME=["全学年","中1","中2","中3"];
const KEY=APP.key;
let S={srs:{},days:{},known:{},grade:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const inG=x=>!S.grade||x.gr===S.grade;
const QG=()=>Q.filter(inG);
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const INTERVAL=[0,1,2,4,8,16,32];
function record(id,ok){const t=today(),r=S.srs[id]||{b:0,d:t,w:0,c:0};
  if(ok){r.b=Math.min(r.b+1,6);r.c++}else{r.b=1;r.w++}
  r.d=t+(ok?INTERVAL[r.b]:0);S.srs[id]=r;
  const dk=String(t);S.days[dk]=S.days[dk]||{n:0,c:0};S.days[dk].n++;if(ok)S.days[dk].c++;save()}
function streak(){let t=today(),n=0;if(!S.days[t])t--;while(S.days[t]){n++;t--}return n}
const isDue=q=>{const r=S.srs[q.id];return r&&r.d<=today()};
const boxOf=q=>(S.srs[q.id]||{}).b||0;
const mastered=q=>boxOf(q)>=3;
const isWeak=q=>{const r=S.srs[q.id];return r&&r.w>0&&r.b<3};
function buildSet(pool,n){n=n||10;
  const due=shuffle(pool.filter(isDue)).sort((a,b)=>boxOf(a)-boxOf(b));
  const fresh=shuffle(pool.filter(q=>!S.srs[q.id]));
  const k=Math.ceil(n*.6);
  let set=due.slice(0,k).concat(fresh).slice(0,n);
  if(set.length<n)set=set.concat(due.slice(k)).slice(0,n);
  if(set.length<n){const rest=shuffle(pool.filter(q=>set.indexOf(q)<0)).sort((a,b)=>boxOf(a)-boxOf(b));set=set.concat(rest).slice(0,n)}
  return shuffle(set)}
function dailySet(){const P=QG();const fresh=[];const byCat=CATS.map(c=>shuffle(P.filter(q=>q.cat===c.id&&!S.srs[q.id])));
  for(let k=0;fresh.length<10&&k<20;k++)byCat.forEach(a=>{if(a[k])fresh.push(a[k])});
  const due=shuffle(P.filter(isDue)).sort((a,b)=>boxOf(a)-boxOf(b));
  let set=due.slice(0,6).concat(shuffle(fresh)).slice(0,10);
  if(set.length<10)set=set.concat(due.slice(6)).slice(0,10);
  if(set.length<10)set=set.concat(shuffle(P.filter(q=>set.indexOf(q)<0))).slice(0,10);
  return shuffle(set)}

/* ===== 今日 ===== */

  const catHtml=g=>CATS.filter(c=>c.g===g&&P.some(q=>q.cat===c.id)).map(c=>{const qs=P.filter(q=>q.cat===c.id),m=qs.filter(mastered).length,du=qs.filter(isDue).length;
    const isGen=qs[0].type==="gen";
    return `<button class="cat" data-cat="${c.id}"><span class="nm">${c.nm}</span><span class="meta">${isGen?"計算・毎回ちがう問題":qs.length+"問"} ・ 定着 ${Math.round(m/qs.length*100)}%${du?` ・ 復習 ${du}`:""}</span><span class="bar"><i style="width:${m/qs.length*100}%"></i></span></button>`}).join("");
  const groups=GROUPS.map(G=>{const h=catHtml(G.k);return h?`<div class="group-title"><span class="kan">${G.nm}</span><span class="eyebrow">分野別に解く</span></div><div class="cats">${h}</div>`:""}).join("");
  document.getElementById("v-home").innerHTML=`
  <p class="note" style="margin:0"><b>${GNAME[S.grade]}</b>の範囲：${APP.gdesc[S.grade]}</p>
  <div class="sheet today">
    <svg class="ring" viewBox="0 0 84 84" role="img" aria-label="今日の目標の達成度">
      <circle class="bgc" cx="42" cy="42" r="36"/><circle class="fg" cx="42" cy="42" r="36" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 42 42)"/>
      <text x="42" y="50" text-anchor="middle">${d.n}</text></svg>
    <div class="stats"><div class="eyebrow">今日の学習</div>
      <div>目標 <b>${GOAL}</b>問中 <b>${d.n}</b>問・正解 <b>${d.c}</b></div>
      <div class="note">復習待ち <b>${due}</b> ／ 定着 <b>${mast}</b>/${P.length}</div></div>
  </div>
  <button class="big-btn" id="b-daily">今日のおすすめ10問<span>${due?`復習 ${Math.min(due,6)}問＋新しい問題`:"いろいろな分野から新しい問題"}・間違えた問題はくり返し出ます</span></button>
  <div class="row-btns"><button class="sub-btn" id="b-weak">苦手だけ（${weak}）</button><button class="sub-btn" id="b-mix">ランダム20問</button></div>
  ${groups}
  <p class="note">正解した問題は 1→2→4→8日後… と間をあけて出題され、間違えた問題はすぐ復習に戻ります（間隔反復）。3回続けて正解すると「定着」です。</p>`;
  document.getElementById("streak").textContent=`連続 ${streak()}日`;
  document.getElementById("b-daily").onclick=()=>startQuiz(dailySet(),"今日のおすすめ");
  document.getElementById("b-mix").onclick=()=>startQuiz(shuffle(QG()).slice(0,20),"ランダム20問");
  document.getElementById("b-weak").onclick=()=>{const w=QG().filter(isWeak);if(w.length)startQuiz(shuffle(w).slice(0,15),"苦手の復習");else showView("weak")};
  Array.prototype.forEach.call(document.querySelectorAll("#v-home .cat"),b=>b.onclick=()=>{const c=CATS.filter(x=>x.id===b.dataset.cat)[0];startQuiz(buildSet(QG().filter(q=>q.cat===c.id)),c.nm)});
}

/* ===== クイズ ===== */
const QZ=document.getElementById("quiz");
let RUN=null;
function startQuiz(list,title){if(!list.length)return;RUN={list:list,i:0,title:title,res:[]};QZ.hidden=false;document.body.style.overflow="hidden";renderQ()}
function closeQuiz(){QZ.hidden=true;document.body.style.overflow="";RUN=null;renderAll()}
function materialize(q){if(q.type!=="gen")return q;
  for(let t=0;t<20;t++){try{const r=q.fn();const w=fillWrong(String(r[1]),r[2]||[],r[4]||(g=>String(r[1])+"＋"+(g+1)));if(w.length===3)return {type:"mc",cat:q.cat,id:q.id,label:q.label,prompt:r[0],correct:String(r[1]),wrong:w,explain:r[3]||"",gr:q.gr}}catch(e){}}
  throw new Error("問題を作れませんでした: "+q.id)}
function renderQ(){
  const q=materialize(RUN.list[RUN.i]),cat=CATS.filter(c=>c.id===q.cat)[0],grp=GROUPS.filter(G=>G.k===cat.g)[0];
  RUN.cur=q;
  const ch=shuffle([q.correct].concat(q.wrong));
  QZ.innerHTML=`<div class="wrap"><div class="qhead"><button class="x" id="qx" aria-label="やめる">×</button><span class="bar"><i style="width:${RUN.i/RUN.list.length*100}%"></i></span><span class="cnt">${RUN.i+1}/${RUN.list.length}</span></div>
  <div class="qcat">${grp.nm}・${cat.nm}</div><div class="qtext">${q.prompt}</div>
  <div class="choices">${ch.map((c,k)=>`<button class="ch" data-k="${k}"><span class="lb">${"アイウエ"[k]}</span><span>${c}</span></button>`).join("")}</div><div id="qfb"></div></div>`;
  Array.prototype.forEach.call(QZ.querySelectorAll(".ch"),b=>b.onclick=()=>{const ok=ch[+b.dataset.k]===q.correct;
    Array.prototype.forEach.call(QZ.querySelectorAll(".ch"),x=>{x.disabled=true;if(ch[+x.dataset.k]===q.correct)x.classList.add("ok")});if(!ok)b.classList.add("ng");
    answer(q,ok,`正解：${q.correct}${q.explain?"<br>"+q.explain:""}`)});
  document.getElementById("qx").onclick=closeQuiz;
  QZ.scrollTop=0;
}
function answer(q,ok,html){record(q.id,ok);RUN.res.push({q:q,src:RUN.list[RUN.i],ok:ok});
  const last=RUN.i===RUN.list.length-1;
  document.getElementById("qfb").innerHTML=`<div class="fb ${ok?"ok":"ng"}"><div class="v">${ok?"正解！":"おしい！"}</div>${html}</div><button class="big-btn next" id="qn">${last?"結果を見る":"次へ"}</button>`;
  const n=document.getElementById("qn");n.onclick=()=>{if(last)renderResult();else{RUN.i++;renderQ()}};
  try{n.scrollIntoView({behavior:"smooth",block:"nearest"})}catch(e){}}
function renderResult(){const c=RUN.res.filter(r=>r.ok).length,ng=RUN.res.filter(r=>!r.ok);
  const msg=c===RUN.res.length?"全問正解！この調子。":c/RUN.res.length>=.7?"よくできました。間違えた問題は明日以降にまた出ます。":"間違えた問題こそ伸びしろ。もう一度解いてみよう。";
  QZ.innerHTML=`<div class="wrap result"><div class="eyebrow">${esc(RUN.title)}</div><div class="score">${c}<small style="font-size:1.2rem">/${RUN.res.length}</small></div><p>${msg}</p>
  ${ng.length?`<div class="sheet"><div class="eyebrow">間違えた問題</div><ul>${ng.map(r=>`<li>${esc(r.q.label)} → <b>${r.q.correct}</b></li>`).join("")}</ul></div>
  <button class="big-btn" id="r-again">間違えた${ng.length}問をもう一度</button>`:""}
  <button class="sub-btn" id="r-close">ホームにもどる</button></div>`;
  const ag=document.getElementById("r-again");if(ag)ag.onclick=()=>startQuiz(shuffle(ng.map(r=>r.src)),"間違えた問題");
  document.getElementById("r-close").onclick=closeQuiz;QZ.scrollTop=0}

/* ===== 要点 ===== */
function renderLearn(){
  document.getElementById("v-learn").innerHTML=`<h2>要点まとめ（${GNAME[S.grade]}）</h2><p class="note" style="margin:0">テスト前はここを読んでから、今日のおすすめ問題で確認しよう。</p>`+
  GROUPS.map(G=>{const ls=LESSONS.filter(l=>l.g===G.k&&(!S.grade||l.gr.indexOf(S.grade)>=0));if(!ls.length)return "";
    return `<div class="group-title"><span class="kan">${G.nm}</span></div>`+ls.map(l=>`<details class="lesson"><summary><span>${l.t}</span><span class="gchip">${l.gr.length===3?"中1〜3":l.gr.map(n=>"中"+n).join("・")}</span></summary><div class="body">${l.h}</div></details>`).join("")}).join("");
}

/* ===== 暗記カード ===== */
let CS={deck:Object.keys(DECKS)[0],onlyNew:true,i:0,flip:false,order:[]};
const deckCards=k=>DECKS[k].cards.filter(inG);
function deckList(){let c=deckCards(CS.deck);if(CS.onlyNew){const u=c.filter(x=>!S.known[x.id]);if(u.length)c=u}return c}
function resetDeck(){CS.order=shuffle(deckList());CS.i=0;CS.flip=false}
function renderCards(){
  const avail=Object.keys(DECKS).filter(k=>deckCards(k).length);
  const box=document.getElementById("v-cards");
  if(!avail.length){box.innerHTML=`<h2>暗記カード</h2><div class="sheet empty">この学年のカードはありません。</div>`;return}
  if(avail.indexOf(CS.deck)<0){CS.deck=avail[0];CS.order=[]}
  if(!CS.order.length)resetDeck();
  const dc=deckCards(CS.deck),known=dc.filter(c=>S.known[c.id]).length,c=CS.order[CS.i];
  box.innerHTML=`<h2>暗記カード（${GNAME[S.grade]}）</h2>
  <div class="decks">${avail.map(k=>`<button class="deck" data-d="${k}" aria-pressed="${k===CS.deck}">${DECKS[k].nm}</button>`).join("")}</div>
  <div class="toggle"><input type="checkbox" id="onlynew" ${CS.onlyNew?"checked":""}><label for="onlynew">覚えていないカードだけ</label><span style="margin-left:auto">覚えた ${known}/${dc.length}</span></div>
  <div class="bar"><i style="width:${known/dc.length*100}%"></i></div>
  ${c?`<div class="flash" id="flash" role="button" tabindex="0" aria-label="カードをめくる">
    <div class="front${c.f.length>12?" long":""}">${c.f}</div>
    ${CS.flip?`<div class="back">${c.b}</div>`:`<div class="hint">タップして答えを見る</div>`}
  </div>
  <div class="note" style="text-align:center">${CS.i+1} / ${CS.order.length}</div>
  <div class="cardbtns"><button class="sub-btn again" id="c-again">まだ</button><button class="sub-btn good" id="c-good">覚えた</button></div>`:
  `<div class="sheet empty">このデッキは全部覚えました。<br><button class="sub-btn" id="c-reset" style="margin-top:10px">覚えた記録を消して最初から</button></div>`}`;
  Array.prototype.forEach.call(document.querySelectorAll(".deck"),b=>b.onclick=()=>{CS.deck=b.dataset.d;resetDeck();renderCards()});
  document.getElementById("onlynew").onchange=e=>{CS.onlyNew=e.target.checked;resetDeck();renderCards()};
  const f=document.getElementById("flash");
  if(f){const flip=()=>{CS.flip=!CS.flip;renderCards()};f.onclick=flip;f.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
    const next=()=>{CS.i++;CS.flip=false;if(CS.i>=CS.order.length)resetDeck();renderCards()};
    document.getElementById("c-good").onclick=()=>{S.known[c.id]=1;save();next()};
    document.getElementById("c-again").onclick=()=>{delete S.known[c.id];save();CS.order.push(c);next()};}
  const rs=document.getElementById("c-reset");if(rs)rs.onclick=()=>{dc.forEach(x=>{delete S.known[x.id]});save();resetDeck();renderCards()};
}

/* ===== 苦手・記録 ===== */
let confirmReset=false;
function renderWeak(){
  const weak=QG().filter(isWeak).sort((a,b)=>S.srs[b.id].w-S.srs[a.id].w);
  const t=today(),days=[];for(let k=6;k>=0;k--){const d=S.days[t-k]||{n:0,c:0};days.push({k:k,n:d.n,c:d.c})}
  const max=Math.max.apply(null,[GOAL].concat(days.map(d=>d.n)));
  const dn=["日","月","火","水","木","金","土"];
  const bars=days.map((d,j)=>{const x=12+j*44,h=d.n/max*90,dt=new Date((t-d.k)*864e5);
    return `<rect x="${x}" y="${110-h}" width="28" height="${h}" rx="4" fill="var(--kin)"/><rect x="${x}" y="${110-d.c/max*90}" width="28" height="${d.c/max*90}" rx="4" fill="var(--ai)"/>
    <text x="${x+14}" y="128" text-anchor="middle" font-size="11" fill="var(--sub)">${dn[dt.getUTCDay()]}</text>${d.n?`<text x="${x+14}" y="${104-h}" text-anchor="middle" font-size="11" fill="var(--ink)">${d.n}</text>`:""}`}).join("");
  const gy=110-GOAL/max*90;
  let tn=0,tc=0;Object.keys(S.days).forEach(k=>{tn+=S.days[k].n;tc+=S.days[k].c});
  const wl={};weak.forEach(q=>{const k=q.label;if(!wl[k])wl[k]={q:q,w:0};wl[k].w+=S.srs[q.id].w});
  const wlist=Object.keys(wl).map(k=>wl[k]).sort((a,b)=>b.w-a.w);
  document.getElementById("v-weak").innerHTML=`<h2>苦手・記録</h2>
  <div class="sheet"><div class="eyebrow">この7日間（太い色＝解いた数・濃い色＝正解数）</div>
   <svg viewBox="0 0 320 136" style="width:100%;height:auto;display:block;margin-top:6px" role="img" aria-label="7日間の学習量">
   <line x1="6" x2="314" y1="${gy}" y2="${gy}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="314" y="${gy-4}" text-anchor="end" font-size="10" fill="var(--sub)">目標${GOAL}</text>${bars}</svg>
   <div class="note">これまでに ${tn}問 解いて正答率 ${tn?Math.round(tc/tn*100):0}%・連続 ${streak()}日</div></div>
  <div class="sheet weak"><div class="eyebrow">苦手な問題（${wlist.length}）</div>
   ${wlist.length?`<ul>${wlist.slice(0,40).map(x=>`<li><span>${esc(x.q.label)}</span><span class="w">×${x.w}</span></li>`).join("")}</ul>
   <button class="big-btn" id="w-go" style="margin-top:12px">苦手を復習する（${Math.min(weak.length,15)}問）</button>`:`<div class="empty">まだ苦手な問題はありません。<br>間違えた問題がここにたまり、3回続けて正解すると消えます。</div>`}</div>
  <div class="sheet"><div class="eyebrow">データ</div><p class="note">学習記録はこの端末のブラウザに保存されます。（アプリの版：${APP_VER}）</p>
   <div class="confirm">${confirmReset?`<span>本当に全部消しますか？</span><button class="sub-btn" id="rs-yes" style="color:var(--ng)">消す</button><button class="sub-btn" id="rs-no">やめる</button>`:`<button class="sub-btn" id="rs">学習記録をリセット</button>`}</div></div>`;
  const g=document.getElementById("w-go");if(g)g.onclick=()=>startQuiz(shuffle(weak).slice(0,15),"苦手の復習");
  const r=document.getElementById("rs");if(r)r.onclick=()=>{confirmReset=true;renderWeak()};
  const y=document.getElementById("rs-yes");if(y)y.onclick=()=>{S={srs:{},days:{},known:{},grade:S.grade};save();confirmReset=false;renderAll()};
  const n=document.getElementById("rs-no");if(n)n.onclick=()=>{confirmReset=false;renderWeak()};
}

/* ===== ナビ ===== */
let VIEW="home";
function showView(v){VIEW=v;["home","learn","cards","weak"].forEach(k=>{document.getElementById("v-"+k).hidden=k!==v});
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"),b=>b.setAttribute("aria-current",b.dataset.v===v?"page":"false"));
  renderAll();try{window.scrollTo(0,0)}catch(e){}}
function renderAll(){renderHome();if(VIEW==="learn")renderLearn();if(VIEW==="cards")renderCards();if(VIEW==="weak")renderWeak()}
Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"),b=>b.onclick=()=>showView(b.dataset.v));
function paintGrade(){Array.prototype.forEach.call(document.querySelectorAll(".grades button"),b=>b.setAttribute("aria-pressed",String(+b.dataset.g===S.grade)))}
Array.prototype.forEach.call(document.querySelectorAll(".grades button"),b=>b.onclick=()=>{S.grade=+b.dataset.g;save();CS.order=[];paintGrade();renderAll()});
paintGrade();renderLearn();renderAll();
</script>
</body>
</html>
